<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>5 Фоток — Квадратные наклейки</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/workspace/style.css">
  </head>
  <body>
    <header class="app-header">
      <h1>Выберите 5 фото</h1>
      <p>Загрузите фото, скадрируйте квадрат — мы распечатаем наклейки.</p>
    </header>

    <main class="grid">
      <div class="slot" data-slot="0">
        <input class="file" type="file" accept="image/*" aria-label="Загрузить фото 1">
        <div class="canvas-wrap">
          <canvas></canvas>
          <div class="placeholder">+</div>
        </div>
        <div class="controls hidden">
          <input type="range" min="0.5" max="3" step="0.01" value="1" class="zoom" aria-label="Масштаб">
          <button class="reset" type="button">Сброс</button>
        </div>
      </div>
      <div class="slot" data-slot="1">
        <input class="file" type="file" accept="image/*" aria-label="Загрузить фото 2">
        <div class="canvas-wrap">
          <canvas></canvas>
          <div class="placeholder">+</div>
        </div>
        <div class="controls hidden">
          <input type="range" min="0.5" max="3" step="0.01" value="1" class="zoom" aria-label="Масштаб">
          <button class="reset" type="button">Сброс</button>
        </div>
      </div>
      <div class="slot" data-slot="2">
        <input class="file" type="file" accept="image/*" aria-label="Загрузить фото 3">
        <div class="canvas-wrap">
          <canvas></canvas>
          <div class="placeholder">+</div>
        </div>
        <div class="controls hidden">
          <input type="range" min="0.5" max="3" step="0.01" value="1" class="zoom" aria-label="Масштаб">
          <button class="reset" type="button">Сброс</button>
        </div>
      </div>
      <div class="slot" data-slot="3">
        <input class="file" type="file" accept="image/*" aria-label="Загрузить фото 4">
        <div class="canvas-wrap">
          <canvas></canvas>
          <div class="placeholder">+</div>
        </div>
        <div class="controls hidden">
          <input type="range" min="0.5" max="3" step="0.01" value="1" class="zoom" aria-label="Масштаб">
          <button class="reset" type="button">Сброс</button>
        </div>
      </div>
      <div class="slot" data-slot="4">
        <input class="file" type="file" accept="image/*" aria-label="Загрузить фото 5">
        <div class="canvas-wrap">
          <canvas></canvas>
          <div class="placeholder">+</div>
        </div>
        <div class="controls hidden">
          <input type="range" min="0.5" max="3" step="0.01" value="1" class="zoom" aria-label="Масштаб">
          <button class="reset" type="button">Сброс</button>
        </div>
      </div>
    </main>

    <footer class="app-footer">
      <button id="export" type="button">Скачать предпросмотр (PNG)</button>
    </footer>

    <script src="/workspace/script.js"></script>
  </body>
</html>
